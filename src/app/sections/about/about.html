<section id="about">
  <div class="container">
    <div class="about__content">
      <h2>{{ t().about.heading }}</h2>

      <p class="about__text about__text--lead">{{ t().about.introduction }}</p>
      <p class="about__text">{{ t().about.experience }}</p>
      <p class="about__text">{{ t().about.interests }}</p>

      <ul class="about__credentials" [attr.aria-label]="t().about.credentialsLabel">
        <li>{{ t().about.diploma }}</li>
        <li>{{ t().about.baccalaureate }}</li>
      </ul>
    </div>
  </div>
</section>
