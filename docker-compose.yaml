services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: connerklee-portfolio

    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true
